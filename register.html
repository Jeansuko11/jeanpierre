  <main>
    <h1>Registration Form</h1>
    <p>Please complete the following form to register for an account on our website.</p>
    <form method="post" action="#">
      <label>Username*<input type="text" name="username" required></label>
      <label>Email Address*<input type="email" name="email" required></label>
      <label>Password*<input type="password" name="password" required></label>
      <label>Confirm Password*<input type="password" name="confirm_password" required></label>
      <label>First Name*<input type="text" name="first_name" required></label>
      <label>Surname*<input type="text" name="surname" required></label>
      <label>Gender* 
        <select name="gender" required>
          <option value="">Select...</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </label>
      <label>Date of Birth<input type="date" name="dob"></label>
      <label>Address*<input type="text" name="address" required></label>
      <label>Suburb*<input type="text" name="suburb" required></label>
      <label>Postcode*<input type="text" name="postcode" required></label>
      <label>State*
        <select name="state" required>
          <option value="">Select...</option>
          <option value="ACT">ACT</option>
          <option value="NSW">NSW</option>
          <option value="NT">NT</option>
          <option value="QLD">QLD</option>
          <option value="SA">SA</option>
          <option value="TAS">TAS</option>
          <option value="VIC">VIC</option>
          <option value="WA">WA</option>
        </select>
      </label>
      <label>Phone Number<input type="tel" name="phone"></label>
      <div class="form-buttons">
        <button type="reset">Clear</button>
        <button type="submit">Register</button>
      </div>
    </form>
  </main>
